[project]
name = "quanttrade"
version = "2.0.0"
description = "QuantTrade: market data, strategy research, backtesting and trading adapters"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = [
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning:backtrader.cerebro",
]

[tool.ruff]
target-version = "py314"
line-length = 100
